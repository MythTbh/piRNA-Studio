server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 4g;
    location /api/ {
        proxy_pass http://engine:8765;
        proxy_set_header Host $http_host;
        proxy_read_timeout 600s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
